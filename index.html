<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <section class="object-controls" aria-labelledby="object-controls-heading">
      <h2 id="object-controls-heading">Objekte auswählen</h2>
      <div id="piste-controls" class="layer-controls"></div>
      <div id="aerialway-controls" class="layer-controls"></div>
    </section>
    <section class="interaction-controls" aria-labelledby="interaction-heading">
      <h2 id="interaction-heading">Interaktionsfunktionen</h2>
      <div
        class="interaction-group"
        role="group"
        aria-labelledby="camera-views-heading"
      >
        <h3 id="camera-views-heading">Ansicht</h3>
        <button type="button" data-camera-view="default">
          Standardansicht
        </button>
        <button type="button" data-camera-view="top">Draufsicht</button>
      </div>
      <div
        class="interaction-group"
        role="group"
        aria-labelledby="object-selection-heading"
      >
        <h3 id="object-selection-heading">Objekt</h3>
        <button type="button" id="object-info-toggle" aria-pressed="false">
          Objektinfo
        </button>
        <p id="object-info-hint" role="status" hidden>
          Ein Objekt oder Symbol anklicken.
        </p>
      </div>
      <a
        href="https://www.hohe.salve.at/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Offizielle Website <span aria-hidden="true">↗</span>
      </a>
      <a
        href="https://www.bergfex.de/w/at/hohe-salve/wetter/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Wetter <span aria-hidden="true">↗</span>
      </a>
    </section>
    <section class="object-info" aria-labelledby="object-info-heading" hidden>
      <header>
        <h2 id="object-info-heading"></h2>
        <button type="button" aria-label="Objektinfo schließen">×</button>
      </header>
      <p class="object-info-layer" hidden></p>
      <dl class="object-info-attributes"></dl>
      <p class="object-info-empty" hidden>Keine weiteren Angaben vorhanden.</p>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
