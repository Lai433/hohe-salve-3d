name: main
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    name: Node 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: install
        run: npm install
      - name: build
        run: npm run build
